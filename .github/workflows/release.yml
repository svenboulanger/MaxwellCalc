name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-13
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: bash
        run: |
          dotnet publish MaxwellCalc.Notebook/MaxwellCalc.Notebook.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishReadyToRun=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            --output publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "MaxwellCalc.Notebook-${{ github.event.release.tag_name }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/* -DestinationPath $name
          echo "ASSET=$name" >> $env:GITHUB_ENV

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="MaxwellCalc.Notebook-${{ github.event.release.tag_name }}-${{ matrix.rid }}.tar.gz"
          tar -czf "$name" -C publish .
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber
